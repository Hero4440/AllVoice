<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amazon.com Shopping Cart</title>
  <link rel="stylesheet" href="store.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
</head>
<body>

  <!-- Top Navigation -->
  <nav class="navbar" role="navigation" aria-label="Main navigation">
    <a href="index.html" class="nav-logo" aria-label="Amazon Home">
      <span class="nav-logo-text">amazon<span class="logo-suffix">.com</span></span>
    </a>
    <div class="nav-deliver">
      <span>Deliver to</span>
      <span class="deliver-to">📍 New York 10001</span>
    </div>
    <div class="nav-search" role="search">
      <select class="nav-search-category" aria-label="Search category"><option>All</option></select>
      <input type="text" class="nav-search-input" placeholder="Search Amazon" aria-label="Search Amazon">
      <button class="nav-search-btn" aria-label="Search">🔍</button>
    </div>
    <a href="#" class="nav-link-block" aria-label="Account & Lists">
      <span class="nav-line-1">Hello, sign in</span>
      <span class="nav-line-2">Account & Lists ▾</span>
    </a>
    <a href="#" class="nav-link-block" aria-label="Returns & Orders">
      <span class="nav-line-1">Returns</span>
      <span class="nav-line-2">& Orders</span>
    </a>
    <a href="cart.html" class="nav-cart" aria-label="Shopping cart">
      <span class="nav-cart-icon">🛒<span class="nav-cart-count" id="cart-count">0</span></span>
      <span>Cart</span>
    </a>
  </nav>
  <div class="sub-nav">
    <a href="#">☰ All</a>
    <a href="#">Today's Deals</a>
    <a href="#">Customer Service</a>
    <a href="#">Accessibility Store</a>
  </div>

  <main class="page-content">
    <div class="cart-layout">
      <!-- Cart Main -->
      <div class="cart-main">
        <h1>Shopping Cart</h1>
        <div class="price-header">Price</div>
        <div id="cart-items-container" aria-label="Cart contents">
          <!-- Rendered by store.js -->
        </div>
      </div>

      <!-- Cart Sidebar -->
      <div class="cart-sidebar" id="cart-sidebar">
        <!-- Rendered by store.js -->
      </div>
    </div>
  </main>

  <div class="footer-back-top" onclick="window.scrollTo(0,0)"><a href="#">Back to top</a></div>
  <div class="footer-bottom">
    <div>amazon <span style="color:#F90;">.com</span></div>
    <div style="margin-top:8px;">© 1996-2026, Amazon.com, Inc. or its affiliates — <em>AllVoice Demo</em></div>
  </div>

  <script src="store.js"></script>
</body>
</html>
